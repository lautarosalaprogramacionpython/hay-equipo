name: hay_equipo
description: Organizacion de equipos y partidos.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cross_file: ^0.3.4+2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  record: ^6.0.0
  shared_preferences: ^2.3.3
  video_player: ^2.9.2

  material_ui: any
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  firebase_messaging: ^17.1.0
  firebase_crashlytics: ^6.1.0
  firebase_analytics: ^13.1.0
  firebase_app_check: ^0.5.2
  google_sign_in: ^7.2.0
  go_router: ^18.1.4
  flutter_riverpod: ^3.5.0
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ambient_loop.wav
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
